<!doctype html>
<!-- DESIGN BRIEF
Direction: premium restraint. The owner asked to follow the structure and typography of his
  reference, cordia.studio: a white room where the work is the only colour. Home is an endless
  canvas of his videos that you drag around one quiet sentence; Work is a set of client boxes
  that open into each client's videos; About and Contact are narrow, almost text-only pages.
  Written from scratch, with his content.
Color: #ffffff ground (the videos supply all the colour), ink #111111, one grey #8f8f8f for
  secondary text, hairlines #ececec. The only accent is the green availability dot.
Type: Inter 400/500 with slightly tight tracking. A stated decision: the owner asked for the
  reference's typography, a plain Swiss neo-grotesk at small sizes, and Inter is the closest
  open face. No display face, because it would compete with the videos.
Layout: home leads with the famous faces. Roberto P. Nickson is the biggest client, so his
  videos are double size and repeat. Work is grouped by client, each box showing the client's
  own profile picture. Rounded option buttons on Contact are working controls.
Signature moment: the home canvas. Grab it anywhere and it moves, with no edge in any direction.
-->

  (() => {

    if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
